<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Serverless Modern</title>
  <!-- Memuat Tailwind CSS dari CDN untuk styling instan -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
    <h2 class="text-2xl font-bold text-center mb-2 text-indigo-400">Kirim Pesan Serverless</h2>
    <p class="text-sm text-slate-400 text-center mb-6">Uji coba integrasi front-end dengan Vercel API.</p>
    
    <!-- Input Form -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Pesan Kamu</label>
        <input type="text" id="inputPesan" placeholder="Ketik sesuatu di sini..." 
          class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-indigo-500 text-slate-100 placeholder-slate-500 text-sm">
      </div>
      
      <button onclick="kirimData()" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/30 text-sm">
        Kirim Data (POST)
      </button>
    </div>

    <!-- Area Hasil Respon -->
    <div class="mt-6">
      <span class="block text-xs font-semibold text-slate-400 uppercase mb-2">Respon dari Server:</span>
      <pre id="hasil" class="bg-slate-900 border border-slate-700 p-4 rounded-lg text-emerald-400 text-xs overflow-x-auto min-h-[80px]">Belum ada data dikirim...</pre>
    </div>
  </div>

  <script>
    async function kirimData() {
      const pesan = document.getElementById('inputPesan').value;
      const kotakHasil = document.getElementById('hasil');
      
      if (!pesan.trim()) {
        kotakHasil.textContent = '⚠️ Pesan tidak boleh kosong!';
        return;
      }

      kotakHasil.textContent = 'Mengirim data ke serverless...';

      try {
        const respon = await fetch('/api/kirim-data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pesanUser: pesan })
        });

        const data = await respon.json();
        kotakHasil.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        kotakHasil.textContent = '❌ Gagal terhubung ke server.';
      }
    }
  </script>
</body>
</html>
